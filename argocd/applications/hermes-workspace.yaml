apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-workspace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:ergoshear/k3s.git
    targetRevision: HEAD
    path: apps/hermes-workspace
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-workspace
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
