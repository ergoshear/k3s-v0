apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami/sealed-secrets.git
    targetRevision: 5703fa2f519fa0604d68ca6b003fd2a01cecdcb2
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets-controller
      parameters:
        - name: fullnameOverride
          value: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
