apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      targetRevision: 1.106.0
      helm:
        valueFiles:
          - $values/apps/litellm/values.yaml
    - repoURL: git@github.com:ergoshear/k3s.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
