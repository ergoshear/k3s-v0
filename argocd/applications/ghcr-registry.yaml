apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghcr-registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:ergoshear/k3s.git
    targetRevision: HEAD
    path: apps/ghcr-registry
  destination:
    server: https://kubernetes.default.svc
    namespace: ghcr-registry
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
