apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.0
          volumeMounts:
            - name: identity-center-signing
              mountPath: /etc/dex/identity-center
              readOnly: true
      volumes:
        - name: identity-center-signing
          configMap:
            name: argocd-identity-center
