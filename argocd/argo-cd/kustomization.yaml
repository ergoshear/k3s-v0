apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - install.yaml
  - namespace.yaml

patches:
  - path: cmd-params-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-.*
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: argocd-.*
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
