apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - install.yaml
  - namespace.yaml

configMapGenerator:
  - name: argocd-identity-center
    files:
      - signing.pem=identity-center-signing.pem
    options:
      labels:
        app.kubernetes.io/part-of: argocd

patches:
  - path: sso-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-cm
  - path: rbac-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: dex-certificate-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-dex-server
  - path: redis-image-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-redis
  - path: cmd-params-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-.*
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: argocd-.*
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
