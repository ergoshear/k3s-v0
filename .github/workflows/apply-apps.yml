name: Apply apps

# Runs on merge to main (and manually). Validates the manifests, then asks
# Argo CD to sync each child Application in argocd/applications and waits for
# each to be Synced and Healthy. Argo CD remains the single owner of both the
# Application definitions and the apps/ manifests (no kubectl ownership).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k3s-apply-apps
  cancel-in-progress: false

jobs:
  configuration-tests:
    name: Validate app manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -v

  apply:
    needs: configuration-tests
    # Only apply on pushes to main or manual runs, not on pull requests.
    if: github.event_name != 'pull_request'
    name: Apply Argo CD applications
    runs-on: [self-hosted, k3s-control-plane-01]
    timeout-minutes: 45
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure Argo CD is available
        run: |
          # The application controller is a StatefulSet in this Argo CD version.
          sudo -n kubectl --kubeconfig="$KUBECONFIG" -n argocd \
            rollout status statefulset/argocd-application-controller --timeout=5m
          sudo -n kubectl --kubeconfig="$KUBECONFIG" -n argocd \
            rollout status deployment/argocd-server --timeout=5m

      - name: Apply the Argo CD application definitions
        run: |
          # Ensures all child Application definitions in argocd/applications are
          # present (creates any newly added ones). Argo CD's automated sync then
          # applies the apps/ manifests for each. Idempotent: a no-op when already
          # synced. This avoids the argocd CLI gRPC connection issues in-cluster.
          sudo -n kubectl --kubeconfig="$KUBECONFIG" \
            apply --server-side --force-conflicts -k argocd/applications

      - name: Wait for each application to be Synced and Healthy
        run: |
          apps="$(awk '/^  - /{print $2}' argocd/applications/kustomization.yaml | sed 's/\.yaml$//')"
          for app in $apps; do
            # Wait for the Application object to exist (bounded to ~60s).
            for _ in $(seq 1 12); do
              if sudo -n kubectl --kubeconfig="$KUBECONFIG" -n argocd \
                get application "$app" >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            # Poll the Application status until it is Synced and Healthy.
            # Argo CD's automated sync drives the actual deployment.
            for _ in $(seq 1 90); do
              status="$(sudo -n kubectl --kubeconfig="$KUBECONFIG" -n argocd \
                get application "$app" -o jsonpath='{.status.sync.status}/{.status.health.status}' 2>/dev/null)"
              if [ "$status" = "Synced/Healthy" ]; then
                echo "$app is Synced/Healthy"
                break
              fi
              # Fail fast if the app reports an error state.
              if [ "$status" = "*/Error" ] || [ "$status" = "*/Degraded" ]; then
                echo "$app reached $status" >&2
                exit 1
              fi
              sleep 10
            done
            # If we exhausted the loop without Synced/Healthy, fail.
            if [ "$status" != "Synced/Healthy" ]; then
              echo "$app did not reach Synced/Healthy (last: $status)" >&2
              exit 1
            fi
          done
