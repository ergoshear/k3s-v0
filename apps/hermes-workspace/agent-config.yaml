apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: hermes-workspace
data:
  config.yaml: |
    model:
      default: Qwen3-Coder-30B-A3B
      provider: custom:mlops-node-7
      base_url: http://mlops-node-7.hermes-workspace.svc.cluster.local:8080/v1
    providers:
      mlops-node-7:
        base_url: http://mlops-node-7.hermes-workspace.svc.cluster.local:8080/v1
        discover_models: true
      mlops-node-9:
        base_url: http://mlops-node-9.hermes-workspace.svc.cluster.local:8080/v1
        discover_models: true
    platforms:
      api_server:
        enabled: true
