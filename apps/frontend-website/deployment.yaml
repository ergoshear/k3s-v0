apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-website
  namespace: frontend-website
  labels:
    app.kubernetes.io/name: frontend-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-website
    spec:
      imagePullSecrets:
        - name: ghcr-registry-credentials
      containers:
        - name: web
          image: ghcr.io/ergoshear/frontend-website:96244bb
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - /app/.venv/bin/python manage.py migrate && exec /app/.venv/bin/python manage.py runserver 0.0.0.0:8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-website-secrets
                  key: DJANGO_SECRET_KEY
            - name: DJANGO_ALLOWED_HOSTS
              value: ergoshear.dev,www.ergoshear.dev
            - name: DJANGO_DEBUG
              value: "0"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: ergoshear
            - name: POSTGRES_USER
              value: ergoshear
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-website-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
