apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: frontend-website
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: frontend-website
      images:
        - alias: frontend
          imageName: ghcr.io/ergoshear/frontend-website:latest
          commonUpdateSettings:
            updateStrategy: digest
            platforms:
              - linux/amd64
          manifestTargets:
            kustomize:
              name: ghcr.io/ergoshear/frontend-website
