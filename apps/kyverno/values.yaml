config:
  preserve: false
  enableDefaultRegistryMutation: false
  excludeKyvernoNamespace: false
  resourceFiltersExclude:
    - '[*/*,kube-system,*]'
    - '[*/*,kube-public,*]'
    - '[*/*,kube-node-lease,*]'
  webhooks:
    namespaceSelector:
      matchExpressions: []

features:
  admissionReports:
    enabled: false
  policyReports:
    enabled: false
  reporting:
    validate: false
    mutate: false
    mutateExisting: false
    imageVerify: false
    generate: false
  generateValidatingAdmissionPolicy:
    enabled: false
  logging:
    verbosity: 0

admissionController:
  replicas: 2
  container:
    extraArgs:
      clientRateLimitQPS: "10"
      clientRateLimitBurst: "20"
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "watch"]

backgroundController:
  extraArgs:
    clientRateLimitQPS: "10"
    clientRateLimitBurst: "20"
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

cleanupController:
  enabled: false

reportsController:
  enabled: false
