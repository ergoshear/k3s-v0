apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hf-mirror
  namespace: hf-mirror
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-route53
    external-dns.kubernetes.io/target: k3s.ergoshear.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hf.ergoshear.dev
      secretName: hf-mirror-tls
  rules:
    - host: hf.ergoshear.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hf-mirror
                port:
                  name: http
