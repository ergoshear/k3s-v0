apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-hf-mirror
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  admission: true
  background: false
  emitWarning: false
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: configure-model-downloads
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - cert-manager
                - ghcr-registry
                - hf-mirror
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - monitoring
                - tailscale
                - trivy-system
      mutate:
        foreach:
          - list: request.object.spec.containers
            patchesJson6902: |-
              - op: add
                path: /spec/containers/{{ elementIndex }}/env
                value: {{ element.env[?name != 'HF_ENDPOINT' && name != 'HF_HUB_DISABLE_XET'] || `[]` }}
              - op: add
                path: /spec/containers/{{ elementIndex }}/env/-
                value:
                  name: HF_ENDPOINT
                  value: http://hf-mirror.hf-mirror.svc.cluster.local:8080
              - op: add
                path: /spec/containers/{{ elementIndex }}/env/-
                value:
                  name: HF_HUB_DISABLE_XET
                  value: "1"
          - list: request.object.spec.initContainers || `[]`
            patchesJson6902: |-
              - op: add
                path: /spec/initContainers/{{ elementIndex }}/env
                value: {{ element.env[?name != 'HF_ENDPOINT' && name != 'HF_HUB_DISABLE_XET'] || `[]` }}
              - op: add
                path: /spec/initContainers/{{ elementIndex }}/env/-
                value:
                  name: HF_ENDPOINT
                  value: http://hf-mirror.hf-mirror.svc.cluster.local:8080
              - op: add
                path: /spec/initContainers/{{ elementIndex }}/env/-
                value:
                  name: HF_HUB_DISABLE_XET
                  value: "1"
