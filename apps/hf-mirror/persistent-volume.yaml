apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-mirror-cache
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hf-mirror-local
  volumeMode: Filesystem
  hostPath:
    path: /srv/storage/hf-mirror-cache
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - mlops-node-5
