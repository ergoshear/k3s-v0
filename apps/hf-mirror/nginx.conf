worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    map $upstream_http_location $redirect_target {
        volatile;
        default "";
        ~^/ https://huggingface.co$upstream_http_location;
        ~^https://([a-zA-Z0-9-]+\.)*(huggingface\.co|hf\.co)/ $upstream_http_location;
    }

    map $http_authorization $authenticated_request {
        default 1;
        "" 0;
    }

    map $http_cookie $has_cookie {
        default 1;
        "" 0;
    }

    map $request_method $metadata_request {
        default 0;
        HEAD 1;
    }

    map $download_url $redirect_authorization {
        volatile;
        default "";
        ~^https://huggingface\.co/ $http_authorization;
    }

    map $download_url $redirect_cookie {
        volatile;
        default "";
        ~^https://huggingface\.co/ $http_cookie;
    }

    map $upstream_http_x_repo_commit $response_repo_commit {
        default $upstream_http_x_repo_commit;
        "" $repo_commit;
    }

    map $upstream_http_x_linked_etag $response_linked_etag {
        default $upstream_http_x_linked_etag;
        "" $linked_etag;
    }

    map $upstream_http_x_linked_size $response_linked_size {
        default $upstream_http_x_linked_size;
        "" $linked_size;
    }

    proxy_cache_path /var/cache/nginx/hf
                     levels=1:2
                     keys_zone=hf_cache:100m
                     max_size=2800g
                     inactive=90d
                     use_temp_path=off;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering on;
    proxy_request_buffering off;
    proxy_cache_lock on;
    proxy_cache hf_cache;
    proxy_cache_key "huggingface.co$request_uri";
    proxy_cache_valid 200 1h;
    proxy_cache_revalidate on;
    proxy_cache_bypass $authenticated_request $has_cookie $metadata_request;
    proxy_no_cache $authenticated_request $has_cookie $metadata_request;
    proxy_cache_convert_head off;
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    proxy_force_ranges on;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_hide_header X-Repo-Commit;
    proxy_hide_header X-Linked-Etag;
    proxy_hide_header X-Linked-Size;
    add_header X-Repo-Commit $response_repo_commit always;
    add_header X-Linked-Etag $response_linked_etag always;
    add_header X-Linked-Size $response_linked_size always;
    recursive_error_pages on;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

    server {
        listen 8080;
        server_name _;
        set $repo_commit "";
        set $linked_etag "";
        set $linked_size "";

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass https://huggingface.co;
            proxy_set_header Host huggingface.co;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;

            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @download_redirect;
        }

        location @download_redirect {
            # Capture Location before proxy_pass replaces the upstream state.
            set $download_url $redirect_target;
            if ($upstream_http_x_repo_commit != "") {
                set $repo_commit $upstream_http_x_repo_commit;
            }
            if ($upstream_http_x_linked_etag != "") {
                set $linked_etag $upstream_http_x_linked_etag;
            }
            if ($upstream_http_x_linked_size != "") {
                set $linked_size $upstream_http_x_linked_size;
            }
            if ($download_url = "") {
                return 502;
            }
            proxy_pass $download_url;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $redirect_authorization;
            proxy_set_header Cookie $redirect_cookie;
            proxy_set_header Range "";
            proxy_set_header If-Range "";
            proxy_ssl_server_name on;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @download_redirect;
        }
    }
}
