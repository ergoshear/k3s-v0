apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-mirror
  namespace: hf-mirror
  labels:
    app.kubernetes.io/name: hf-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hf-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hf-mirror
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-5
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hf-mirror
          image: ghcr.io/ergoshear/hf-mirror:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-mirror-cache
