apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - persistent-volume.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingress.yaml
  - network-policy.yaml
  - client-policy.yaml

configMapGenerator:
  - name: hf-mirror-nginx
    namespace: hf-mirror
    files:
      - nginx.conf

images:
  - name: ghcr.io/ergoshear/hf-mirror
    newName: ghcr.io/ergoshear/hf-mirror
    newTag: latest
