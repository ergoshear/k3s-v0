apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-proxy-clients
  namespace: tailscale
spec:
  podSelector:
    matchLabels:
      tailscale.com/parent-resource: egress-proxies
      tailscale.com/parent-resource-type: proxygroup
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-workspace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-workspace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9002
