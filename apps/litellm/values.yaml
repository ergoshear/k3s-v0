ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-route53
    external-dns.kubernetes.io/target: k3s.ergoshear.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: litellm.ergoshear.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: litellm-tls
      hosts:
        - litellm.ergoshear.dev

postgresql:
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-2"

migrationJob:
  hooks:
    argocd:
      enabled: false
  jobAnnotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "-1"
  ttlSecondsAfterFinished: null

envVars:
  DOCS_URL: /docs
  ROOT_REDIRECT_URL: /ui/
  STORE_MODEL_IN_DB: "True"
  SAML_IDP_METADATA_URL: https://portal.sso.us-east-2.amazonaws.com/saml/metadata/MjA0NDU5MDM4Njc2X2lucy02Njg0ZTBmZGY2OTFiNjMx
  PROXY_BASE_URL: https://litellm.ergoshear.dev
  SAML_SP_ENTITY_ID: https://litellm.ergoshear.dev/sso/saml/metadata
  SAML_ATTRIBUTE_USER_ID: email
  PROXY_ADMIN_ID: christopher@agilityqa.com

