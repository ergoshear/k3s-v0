    # ==========================================================================
    # 6. Auto Routers (Sit Above Your Deployments & Pick a Tier Per Request)
    # ==========================================================================
    # --- auto: Sub-Millisecond Heuristic Auto Router (Zero Classifier Latency) ---
    - model_name: auto
      litellm_params:
        model: auto_router/complexity_router
        complexity_router_default_model: coder
        complexity_router_config:
          classifier_type: heuristic
          enable_context_window_escalation: true
          context_window_escalation_buffer: 0.95
          modality_routing: true
          classification_mode: user_turn
          tiers:
            SIMPLE: fast
            MEDIUM: coder
            COMPLEX: deepseek
            REASONING: deepseek
          keyword_tier_rules:
            - keywords: ["hi", "hello", "thanks", "ping", "commit message", "docstring", "rename"]
              tier: SIMPLE
            - keywords: ["architecture", "root cause", "race condition", "deadlock", "design a", "tradeoffs", "step by step"]
              tier: REASONING

    # --- auto-hybrid: Heuristic + Fast Agentic Judge for Boundary Requests ---
    - model_name: auto-hybrid
      litellm_params:
        model: auto_router/complexity_router
        complexity_router_default_model: coder
        complexity_router_config:
          classifier_type: hybrid
          local_heuristic: heuristic
          hybrid_boundary_margin: 0.05
          enable_context_window_escalation: true
          context_window_escalation_buffer: 0.95
          modality_routing: true
          classification_mode: user_turn
          classifier_llm_config:
            model: fast
            timeout_ms: 2500
            classification_rubric: agentic
            classifier_fallback: heuristic
            classifier_context_window_size: 3
            classifier_context_budget_chars: 8000
          tiers:
            SIMPLE: fast
            MEDIUM: coder
            COMPLEX: deepseek
            REASONING: deepseek

  router_settings:
    routing_strategy: least-busy
    routing_groups:
      - group_name: qwen38-flash-next-balanced
        models:
          - Qwen3.8-Flash-Next-256K
        routing_strategy: simple-shuffle
      - group_name: deepseek-balanced
        models:
          - deepseek
        routing_strategy: simple-shuffle
    enable_pre_call_checks: true
    num_retries: 2
    timeout: 300
    cooldown_time: 15
    model_group_alias:
      default: auto
      high-performance: deepseek
      deepseek-flash: deepseek
      gpt-4o:
        model: auto
        hidden: true
      gpt-4o-mini:
        model: fast
        hidden: true
      o3-mini:
        model: architect
        hidden: true
      claude-3-7-sonnet-latest:
        model: auto
        hidden: true
    fallbacks:
      - auto:
          - coder
          - fast
      - auto-hybrid:
          - auto
          - coder
      - fast:
          - coder
      - coder:
          - architect
          - fast
      - architect:
          - coder
      - vision:
          - coder

  litellm_settings:
    drop_params: true
    modify_params: true
    allowed_openai_params:
      - max_tokens
      - max_completion_tokens
      - temperature
      - top_p
      - stop
      - stream
      - tools
      - tool_choice
      - response_format
      - chat_template_kwargs
      - reasoning_format
      - reasoning_budget
      - enable_thinking
