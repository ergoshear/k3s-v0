    # ==========================================================================
    # 5. Auto Router (Single Entrypoint Above All Tiers)
    # ==========================================================================
    - model_name: auto
      litellm_params:
        model: auto_router/complexity_router
        complexity_router_default_model: coder
        complexity_router_config:
          classifier_type: heuristic
          enable_context_window_escalation: true
          context_window_escalation_buffer: 0.95
          modality_routing: true
          classification_mode: user_turn
          tiers:
            SIMPLE: fast
            MEDIUM: coder
            COMPLEX: architect
            REASONING: deepseek
          keyword_tier_rules:
            - keywords: ["hi", "hello", "thanks", "ping", "commit message", "docstring", "rename"]
              tier: SIMPLE
            - keywords: ["architecture", "root cause", "race condition", "deadlock", "design a", "tradeoffs", "step by step"]
              tier: REASONING

  router_settings:
    routing_strategy: least-busy
    enable_pre_call_checks: true
    num_retries: 2
    timeout: 300
    cooldown_time: 15
    model_group_alias:
      default:
        model: auto
        hidden: true
      gpt-4o:
        model: auto
        hidden: true
      gpt-4o-mini:
        model: fast
        hidden: true
      o3-mini:
        model: deepseek
        hidden: true
      claude-3-7-sonnet-latest:
        model: auto
        hidden: true
    fallbacks:
      - auto:
          - coder
          - fast
      - fast:
          - coder
      - coder:
          - architect
          - fast
      - architect:
          - deepseek
          - coder
      - deepseek:
          - architect
          - coder
      - long-context:
          - coder

  litellm_settings:
    drop_params: true
    modify_params: true
    allowed_openai_params:
      - max_tokens
      - max_completion_tokens
      - temperature
      - top_p
      - stop
      - stream
      - tools
      - tool_choice
      - response_format
      - chat_template_kwargs
      - reasoning_format
      - reasoning_budget
      - enable_thinking
    set_verbose: false
    request_timeout: 300

  general_settings:
    disable_env_credential_login: true
    master_key: os.environ/PROXY_MASTER_KEY