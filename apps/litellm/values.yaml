ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-route53
    external-dns.kubernetes.io/target: k3s.ergoshear.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: litellm.ergoshear.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: litellm-tls
      hosts:
        - litellm.ergoshear.dev

postgresql:
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-2"

migrationJob:
  hooks:
    argocd:
      enabled: false
  jobAnnotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "-1"
  ttlSecondsAfterFinished: null

envVars:
  DOCS_URL: /docs
  ROOT_REDIRECT_URL: /ui/
  STORE_MODEL_IN_DB: "True"

proxy_config:
  model_list:
    - model_name: mlops-node-4/*
      litellm_params:
        model: openai/*
        api_base: http://mlops-node-4.hermes-workspace.svc.cluster.local:8080/v1
        api_key: not-required
      litellm_settings:
        check_provider_endpoint: true
    - model_name: mlops-node-6/*
      litellm_params:
        model: openai/*
        api_base: http://mlops-node-6.hermes-workspace.svc.cluster.local:8080/v1
        api_key: not-required
      litellm_settings:
        check_provider_endpoint: true
    - model_name: mlops-node-7/*
      litellm_params:
        model: openai/*
        api_base: http://mlops-node-7.hermes-workspace.svc.cluster.local:8080/v1
        api_key: not-required
      litellm_settings:
        check_provider_endpoint: true
    - model_name: mlops-node-9/*
      litellm_params:
        model: openai/*
        api_base: http://mlops-node-9.hermes-workspace.svc.cluster.local:8080/v1
        api_key: not-required
      litellm_settings:
        check_provider_endpoint: true
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
